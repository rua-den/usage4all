[package]
name = "claude-usage-dashboard"
version.workspace = true
edition.workspace = true
description = "claude-usage dashboard window (wry/WebView2), reuses ui.html"

[[bin]]
name = "claude-usage-dashboard"
path = "src/main.rs"

[dependencies]
cu-core = { path = "../crates/core" }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
tao = { version = "=0.35.3", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
# JS-driven end-to-end hook (`--e2e <script> <out>`): always on in debug builds, release needs `--features e2e` (tests only).
e2e = []

[dev-dependencies]
tempfile = "=3.20.0"

[build-dependencies]
winresource = "=0.1.34"
